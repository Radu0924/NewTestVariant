# DJI Mavic Series Acoustic Profile
name: DJI Mavic Series
drone_type: quadcopter_medium
manufacturer: DJI
model: Mavic (Pro/Air/Mini)

acoustic_characteristics:
  fundamental_frequency: 250.0  # Hz
  harmonic_frequencies: [500, 750, 1000, 1250, 1500, 2000]
  frequency_range: [150, 4000]

  motor_characteristics:
    rpm_range: [4000, 8000]
    motor_frequency_range: [200, 400]
    num_motors: 4

  propeller_characteristics:
    num_blades: 2
    prop_frequency_range: [600, 2500]
    blade_pass_frequency: 180  # At hover

spectral_features:
  spectral_centroid: 850.0
  spectral_bandwidth: 400.0
  spectral_rolloff: 2500.0

detection_parameters:
  confidence_threshold: 0.6
  min_snr: 10.0
  detection_range: 300.0  # meters

notes: |
  DJI Mavic drones produce distinctive motor whine in the 200-400 Hz range
  with clear harmonics. Propeller blade pass frequency around 180 Hz at hover.
  Sound profile varies with flight mode and payload.
